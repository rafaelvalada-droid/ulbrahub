<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UlbraHub</title>
<meta name="description" content="UlbraHub — Hub de Acessos ULBRA">
<meta name="theme-color" content="#06655b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UlbraHub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap">
<style>
  /* Casca do UlbraHub: é ela que o celular instala como app (ícone, nome e tela cheia).
     O hub de verdade (Apps Script) abre dentro dela, ocupando a tela toda. */
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html, body{ margin:0; height:100%; overflow:hidden; background:#eef6f1; color:#153a2e;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #hub{ position:fixed; inset:0; width:100%; height:100%; border:0; background:#eef6f1; }

  /* tela de abertura: fica até o hub avisar que carregou (ou até 8 s, para não esconder um login) */
  .splash{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(70% 55% at 50% 40%, #ffffff 0%, #eef6f1 55%, #e2f0e7 100%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  .splash.sai{ opacity:0; visibility:hidden; }
  .icone{ position:relative; width:112px; height:112px; }
  .icone img{ width:100%; height:100%; border-radius:26px; box-shadow:0 18px 40px rgba(6,101,91,.28); display:block; }
  /* feixe dourado girando em volta do ícone, como o radar da Órbita */
  .icone::after{
    content:""; position:absolute; inset:-14px; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(226,160,63,0) 0deg 250deg, rgba(226,160,63,.25) 320deg, #f2c27a 355deg, rgba(226,160,63,0) 360deg);
    -webkit-mask:radial-gradient(circle closest-side, transparent 0 88%, #000 90% 99%, transparent 100%);
            mask:radial-gradient(circle closest-side, transparent 0 88%, #000 90% 99%, transparent 100%);
    animation:gira 1.1s linear infinite;
  }
  @keyframes gira{ to{ transform:rotate(360deg); } }
  .nome{ font-family:'Sora', -apple-system, "Segoe UI", sans-serif; font-weight:800; font-size:30px; letter-spacing:-.025em; color:#06655b; }
  .nome span{ background:linear-gradient(135deg, #c9861f, #e2a03f 40%, #f2c27a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ font:600 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.18em; text-transform:uppercase; color:#6b8478; margin-top:-12px; }

  /* aviso quando o hub não abre aqui dentro (sem internet ou login bloqueado dentro do app) */
  .ajuda{
    position:fixed; z-index:3; left:16px; right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; gap:10px;
    padding:16px; border-radius:16px;
    background:#ffffff; border:1px solid rgba(11,90,69,.16);
    box-shadow:0 18px 40px rgba(15,55,42,.22);
    font-size:14px; line-height:1.45;
  }
  .ajuda strong{ color:#06655b; }
  .ajuda .acoes{ display:flex; flex-direction:column; gap:8px; }
  .ajuda a, .ajuda button{
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    height:44px; padding:0 14px; border-radius:12px;
    font:inherit; font-weight:700; text-decoration:none; cursor:pointer;
  }
  .ajuda a{ background:linear-gradient(135deg, #0a7a6c, #05554b); color:#fff; border:0; }
  .ajuda button{ background:rgba(11,90,69,.06); color:#153a2e; border:1px solid rgba(11,90,69,.2); }
  @media (prefers-reduced-motion:reduce){ .icone::after{ animation:none; } .splash{ transition:none; } }
</style>
</head>
<body>

<iframe id="hub" title="UlbraHub" allow="clipboard-write"></iframe>

<div class="splash" id="splash" aria-live="polite">
  <div class="icone"><img src="icon-192.png" alt=""></div>
  <div class="nome">Ulbra<span>Hub</span></div>
  <div class="sub" id="status">Carregando…</div>
</div>

<div class="ajuda" id="ajuda" role="alert" hidden>
  <div id="ajudaTexto"><strong>O UlbraHub está demorando para abrir aqui.</strong> Se apareceu uma tela de login do Google ou uma página de erro, abra no navegador. Depois de entrar com a conta da ULBRA uma vez, o app costuma abrir direto.</div>
  <div class="acoes">
    <a id="abrirFora" target="_blank" rel="noopener">Abrir no navegador</a>
    <button type="button" id="tentar">Tentar de novo</button>
  </div>
</div>

<script>
  // endereço do UlbraHub (implantação do Apps Script)
  const HUB_URL = "https://script.google.com/a/macros/aelbra.com.br/s/AKfycbwy4UA8Q2Y8-rlbTW1JkIYw1dR0X1iWRUARhptvksX-nRaUubYp81Zz9BWUAsNN6PxyDw/exec";

  const hub = document.getElementById("hub");
  const splash = document.getElementById("splash");
  const ajuda = document.getElementById("ajuda");
  document.getElementById("abrirFora").href = HUB_URL;
  let pronto = false, timers = [];

  function abrir() {
    pronto = false;
    timers.forEach(clearTimeout);
    splash.classList.remove("sai");
    ajuda.hidden = true;
    document.getElementById("status").textContent = "Carregando…";
    if (!navigator.onLine) { mostrarAjuda(true); return; }
    hub.src = HUB_URL;
    // passados 8 s sem o hub avisar que carregou, tira a abertura (pode ter um login esperando)
    timers.push(setTimeout(() => { if (!pronto) splash.classList.add("sai"); }, 8000));
    // e aos 14 s mostra o aviso com a saída pelo navegador
    timers.push(setTimeout(() => { if (!pronto) mostrarAjuda(false); }, 14000));
  }
  function mostrarAjuda(semInternet) {
    document.getElementById("ajudaTexto").innerHTML = semInternet
      ? "<strong>Sem conexão com a internet.</strong> Confira o Wi-Fi ou os dados móveis e tente de novo."
      : "<strong>O UlbraHub está demorando para abrir aqui.</strong> Se apareceu uma tela de login do Google ou uma página de erro, abra no navegador. Depois de entrar com a conta da ULBRA uma vez, o app costuma abrir direto.";
    splash.classList.add("sai");
    ajuda.hidden = false;
  }
  // o hub avisa quando terminou de carregar (linha no JavaScript do hub: postMessage "pronto")
  window.addEventListener("message", (e) => {
    let host = "";
    try { host = new URL(e.origin).hostname; } catch (err) {}
    if (!/\.googleusercontent\.com$|^script\.google\.com$/.test(host)) return;
    if (e.data && e.data.ulbrahub === "pronto") {
      pronto = true;
      timers.forEach(clearTimeout);
      splash.classList.add("sai");
      ajuda.hidden = true;
    }
  });
  document.getElementById("tentar").addEventListener("click", abrir);
  window.addEventListener("online", () => { if (!pronto) abrir(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  abrir();
</script>
</body>
</html>
